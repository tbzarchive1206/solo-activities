name: Sync Solo Activities Companies Media

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solo-activities-companies-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Google Drive
        run: pnpm run sync:drive
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      - run: pnpm test
      - name: Commit changed archive index
        run: |
          if git diff --quiet -- app/data/archive.generated.json; then exit 0; fi
          git config user.name "solo-companies-media-bot"
          git config user.email "solo-companies-media-bot@users.noreply.github.com"
          git add app/data/archive.generated.json
          git commit -m "chore: sync solo activities companies media"
          git push

  deploy:
    needs: sync
    uses: ./.github/workflows/deploy-pages.yml
